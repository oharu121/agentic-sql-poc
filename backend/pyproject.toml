[project]
name = "agentic-sql-backend"
version = "0.1.0"
description = "FastAPI backend for the agentic SQL educational demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "google-genai>=2.9.0",
    "pandas>=3.0.3",
    "openpyxl>=3.1",
    "pyarrow>=24.0.0",
    "duckdb>=1.5.4",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28",
    "pyright>=1.1.410",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

